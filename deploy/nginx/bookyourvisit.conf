# /etc/nginx/sites-available/bookyourvisit.conf
# ln -s /etc/nginx/sites-available/bookyourvisit.conf /etc/nginx/sites-enabled/
#
# Origin sits behind the Cloudflare proxy (orange cloud). TLS here is the
# Cloudflare Origin Certificate, not Let's Encrypt -- CF is the only client.
# Cloudflare SSL/TLS mode must be "Full (strict)".

# Bare :80 -- only Cloudflare should reach this; send it to HTTPS.
server {
    listen 80;
    server_name bookyourvisit-api.samarthh.me
                bookyourvisit.samarthh.me
                bookyourvisit-admin.samarthh.me;
    return 301 https://$host$request_uri;
}

# API -> estates-backend :7410
server {
    listen 443 ssl;
    server_name bookyourvisit-api.samarthh.me;

    ssl_certificate     /etc/ssl/cloudflare/samarthh.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/samarthh.me.key;

    # R2 image uploads; express.json limit is 10mb
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:7410;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Public site -> estates-webfront :7411
server {
    listen 443 ssl;
    server_name bookyourvisit.samarthh.me;

    ssl_certificate     /etc/ssl/cloudflare/samarthh.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/samarthh.me.key;

    location / {
        proxy_pass http://127.0.0.1:7411;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin -> estates-admin :7412
server {
    listen 443 ssl;
    server_name bookyourvisit-admin.samarthh.me;

    ssl_certificate     /etc/ssl/cloudflare/samarthh.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/samarthh.me.key;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:7412;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
